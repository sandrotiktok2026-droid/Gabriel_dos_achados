<style>
:root{--bg:#0f0f10;--card:#1f2024;--line:#ffffff;--text:#ffffff;--mute:#9a9aa2;--acc:#ffe600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}

.social{display:flex;justify-content:center;gap:26px;margin-bottom:26px}

.social .off{opacity:.35;cursor:default}
.link{display:flex;align-items:center;gap:12px;min-height:84px;padding:10px 14px;margin:0 0 16px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);text-decoration:none;transition:transform .15s,background .15s}
.link:hover{background:#2a2b31;transform:scale(1.015)}
.link:focus-visible,.social a:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.link img,.link .ph{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none;background:#fff}
.ph{display:grid;place-items:center;background:#000!important;color:#fff}
.ph svg{width:34px;height:34px;fill:currentColor}
.link b{flex:1;font-weight:400;font-size:1.12rem;padding-right:62px}
